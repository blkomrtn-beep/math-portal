<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Calculus Study Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 900px; /* Widened to fit the proxy view */
            width: 95%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 1.8em;
        }
        p {
            color: #7f8c8d;
            font-size: 1em;
            margin-bottom: 20px;
        }
        .formula-box {
            background-color: #ecf0f1;
            padding: 10px;
            border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            margin-bottom: 20px;
            color: #34495e;
        }
        /* This hides the proxy window inside your math page layout */
        .proxy-window {
            width: 100%;
            height: 550px;
            border: 2px solid #bdc3c7;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Calculus II Study Room</h1>
        <p>Access active lecture notes, practice formulas, and global research databases.</p>
        
        <div class="formula-box">
            f'(x) = lim_{h->0} [f(x+h) - f(x)] / h
        </div>

        <!-- This embeds CroxyProxy seamlessly directly inside the math portal page -->
        <iframe src="https://croxyproxy.com" class="proxy-window"></iframe>
    </div>

</body>
</html>
